[project]
name = "mcp-server-graphiti"
version = "1.1.5"
description = "Model Context Protocol server for Graphiti temporal knowledge graphs"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "mcp>=2,<3",
    "openai>=2.41.0",
    "graphiti-core>=0.32.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.0.0",
]

[project.scripts]
mcp-server-graphiti = "mcp_server_graphiti.__main__:main"

[project.optional-dependencies]
falkordb = [
    "graphiti-core[falkordb]>=0.32.0",
]
azure = [
    "azure-identity>=1.25.3",
]
providers = [
    "google-genai>=2.8.0",
    "anthropic>=0.107.1",
    "groq>=1.2.0",
    "voyageai>=0.2.3",
    "sentence-transformers>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/config",
    "src/models",
    "src/services",
    "src/utils",
    "src/mcp_server_graphiti",
]

[tool.hatch.build.targets.wheel.force-include]
"src/graphiti_mcp_server.py" = "graphiti_mcp_server.py"

[tool.uv]
# Pillow 13 has the security fixes and needs Python 3.11+. On Python 3.10, uv resolves
# voyageai 0.2.x, which does not use Pillow.
constraint-dependencies = ["pillow>=13.0.0"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Required by Pydantic on Python < 3.12
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "faker>=40.21.0",
    "httpx>=0.28.1",
    "psutil>=7.1.2",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
]
